# fly.toml app configuration file generated for nile-techno-backend on 2026-06-21T12:33:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nile-techno-backend'
primary_region = 'cdg'
console_command = '/code/manage.py shell'

[build]

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
